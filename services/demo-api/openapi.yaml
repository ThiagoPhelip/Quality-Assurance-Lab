openapi: 3.1.0
info:
  title: QA Lab Demo API
  version: 1.0.0
  description: API local para práticas de autenticação e CRUD de produtos.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health:
    get:
      summary: Verifica a saúde do serviço
      responses:
        "200": { description: Serviço disponível }
  /api/auth/login:
    post:
      summary: Gera uma sessão Bearer temporária
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { description: Autenticado }
        "401": { description: Credenciais inválidas }
  /api/products:
    get:
      security: [{ bearerAuth: [] }]
      summary: Lista produtos
      responses:
        "200": { description: Lista retornada }
        "401": { description: Não autorizado }
    post:
      security: [{ bearerAuth: [] }]
      summary: Cria produto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201": { description: Produto criado }
        "401": { description: Não autorizado }
        "422": { description: Dados inválidos }
  /api/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Produto encontrado }
        "404": { description: Produto ausente }
    put:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200": { description: Produto atualizado }
        "422": { description: Dados inválidos }
    delete:
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Produto removido }
        "404": { description: Produto ausente }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    ProductInput:
      type: object
      required: [name, price, stock]
      properties:
        name: { type: string, minLength: 3 }
        price: { type: number, exclusiveMinimum: 0 }
        stock: { type: integer, minimum: 0 }
